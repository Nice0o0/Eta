name: Probe Test

# 仅用于定位单个测试用例的失败原因（上游基线全绿，本分支失败），
# 触发方式：推送到 verify/** 分支，手动填写要跑的测试过滤式。
on:
  push:
    branches:
      - "verify/**"
  workflow_dispatch:
    inputs:
      test_filter:
        description: "测试过滤式，例如 *AgentBrowserActivityTest*"
        required: false
        default: "*AgentBrowserActivityTest*"

permissions:
  contents: read

concurrency:
  group: probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: 单个测试用例
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 配置构建环境
        uses: ./.github/actions/setup-build

      - name: 安装 NDK
        shell: bash
        run: |
          set -euo pipefail
          ndk_version="$(sed -n 's/^ndk = "\(.*\)"/\1/p' gradle/libs.versions.toml)"
          sdkmanager --channel=3 --install "ndk;$ndk_version"

      - name: 只运行指定测试
        env:
          FILTER: ${{ inputs.test_filter || '*AgentBrowserActivityTest*' }}
        run: >-
          ./gradlew --no-daemon --no-configuration-cache
          :app:testDebugUnitTest --tests "$FILTER"

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-reports
          path: |
            app/build/reports/tests/**
            app/build/test-results/**
          if-no-files-found: warn
          retention-days: 7
